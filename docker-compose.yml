services:
  postgres:
    image: postgres:16
    container_name: mentor-postgres
    environment:
      POSTGRES_DB: mentor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - mentor-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mentor"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mentor-postgres-data:
